<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo gradiente oscuro estilo MC -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2c38" />
      <stop offset="55%" stop-color="#0f171e" />
      <stop offset="100%" stop-color="#070a0e" />
    </radialGradient>

    <!-- Resplandor cian -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#007799" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6375" />
      <stop offset="50%" stop-color="#344856" />
      <stop offset="100%" stop-color="#1f2c35" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0077aa" />
    </linearGradient>
  </defs>

  <!-- Marco redondeado squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGlow)" stroke="#1a2b36" stroke-width="4" />

  <!-- Líneas sutiles de circuito / conexión -->
  <path d="M 120 256 L 220 256 L 256 220 L 320 220" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.35" />
  <path d="M 256 256 L 360 160 L 390 160" stroke="#00d2ff" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Tipografía principal "M" y "S" -->
  <text x="145" y="285" font-family="&#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-weight="900" font-size="165" fill="url(#textGrad)" letter-spacing="-6" text-anchor="middle">M</text>
  <text x="365" y="285" font-family="&#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-weight="900" font-size="165" fill="url(#textGrad)" letter-spacing="-6" text-anchor="middle">S</text>

  <!-- Subtítulo STUDIO -->
  <text x="256" y="375" font-family="&#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-weight="800" font-size="52" fill="#3a5263" letter-spacing="12" text-anchor="middle">STUDIO</text>
  <text x="256" y="415" font-family="&#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-weight="700" font-size="22" fill="url(#subTextGrad)" letter-spacing="8" text-anchor="middle">AI TRANSLATE</text>

  <!-- Destello central de estrella / traducción -->
  <circle cx="256" cy="245" r="75" fill="url(#starGlow)" opacity="0.85" />
  <!-- Puntas del destello -->
  <polygon points="256,155 261,240 346,245 261,250 256,335 251,250 166,245 251,240" fill="#00f0ff" />
  <polygon points="256,190 259,242 311,245 259,248 256,300 253,248 201,245 253,242" fill="#ffffff" />
  <!-- Rayos diagonales menores -->
  <polygon points="256,215 278,223 286,245 278,267 256,275 234,267 226,245 234,223" fill="#ffffff" opacity="0.7" />
</svg>